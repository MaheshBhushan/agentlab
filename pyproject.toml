[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlab"
version = "0.1.0"
description = "Reproducible construction-office agent evaluation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]
